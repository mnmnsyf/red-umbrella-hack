[project]
name = "portwatch"
version = "0.1.0"
description = "Port underwater acoustic anomaly detection demo (spectrogram vs EMD)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pillow>=10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
